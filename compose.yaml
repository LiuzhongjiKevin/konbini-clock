services:
  amemachi:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      AMAP_WEATHER_KEY: ${AMAP_WEATHER_KEY:-}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
